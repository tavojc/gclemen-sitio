<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3f1">
  <title>gclemen · Matemáticas</title>
  <meta name="description" content="Guías, ejercicios y lecciones interactivas de matemáticas del profe Gustavo Clemen.">
  <link rel="stylesheet" href="estilos.css">
</head>

<!-- class="cargando": oculta los datos hasta que lleguen de Firebase.
     Si no hay sesión, app.js manda a ingresar.html. -->
<body class="cargando">
  <main class="pantalla">

    <!-- Barra superior -->
    <div class="barra-superior">
      <span class="marca">gclemen.org</span>
      <span class="chip" id="chip-grado" data-datos>6° grado</span>
    </div>

    <!-- Saludo y título -->
    <div class="saludo" data-datos id="saludo">Hola</div>
    <h1 class="titulo" data-datos id="titulo">Matemáticas</h1>

    <!-- Tarjeta de nivel: toca para ver el progreso -->
    <a class="tarjeta-nivel" href="/progreso.html" data-datos>
      <div class="fila">
        <div>
          <h2 id="nivel">Nivel 1</h2>
          <small id="nivel-detalle">Principiante</small>
        </div>
        <span class="racha" id="racha"></span>
      </div>
      <div class="avance"><div id="barra-nivel"></div></div>
      <div class="nota" id="nivel-nota"></div>
    </a>

    <!-- Continúa donde ibas -->
    <div class="rotulo">Continúa donde ibas</div>
    <a class="continuar" id="continuar" data-datos>
      <span class="cuadro-icono" id="continuar-icono"></span>
      <span>
        <span class="tipo" id="continuar-tipo"></span>
        <strong id="continuar-titulo"></strong>
      </span>
      <span class="flecha" id="continuar-flecha"></span>
    </a>

    <!-- Reto de la semana -->
    <a class="reto" id="reto" data-datos>
      <div class="fila"><span>Reto de la semana</span><span id="reto-xp"></span></div>
      <h2 id="reto-titulo"></h2>
      <small id="reto-detalle"></small>
    </a>

    <!-- Unidades del grado -->
    <div class="encabezado-seccion">
      <h2>Unidades</h2>
      <small id="unidades-conteo" data-datos></small>
    </div>
    <ul class="unidades" id="unidades" data-datos></ul>

  </main>

  <script type="module">
    import { iniciarPantalla, ICONOS, primerNombre, cambiarGradoDocente } from "./js/app.js";
    import { TIPOS, GRADOS } from "./js/contenido.js";

    const $ = (id) => document.getElementById(id);   // atajo para no escribir tanto

    iniciarPantalla("inicio", (usuario, r) => {
      // Encabezado
      $("saludo").textContent = `Hola, ${primerNombre(usuario)}`;
      $("titulo").textContent = `Matemáticas ${r.grado}°`;
      $("chip-grado").textContent = `${r.grado}° grado`;

      // El docente puede cambiar de grado tocando la etiqueta
      if (usuario.esDocente) {
        const grados = Object.keys(GRADOS).map(Number);
        $("chip-grado").textContent += " ▾";
        $("chip-grado").style.cursor = "pointer";
        $("chip-grado").onclick = () => {
          const siguiente = grados[(grados.indexOf(r.grado) + 1) % grados.length];
          cambiarGradoDocente(siguiente);
        };
      }

      // Nivel y racha
      const ganadas = r.insignias.filter((i) => i.ganada).length;
      $("nivel").textContent = `Nivel ${r.nivel}`;
      $("nivel-detalle").textContent = `${r.nombre} · ${ganadas} de ${r.insignias.length} insignias`;
      $("racha").innerHTML = `${ICONOS.fuego} ${r.racha} ${r.racha === 1 ? "día" : "días"}`;
      $("racha").classList.toggle("apagada", r.racha === 0);
      $("nivel-nota").textContent = `${r.xp} / ${r.meta} XP · faltan ${r.faltan} para el nivel ${r.nivel + 1}`;
      // Pequeña pausa para que la barra se vea crecer
      setTimeout(() => ($("barra-nivel").style.width = `${r.porcentaje}%`), 50);

      // Continúa donde ibas
      const c = r.continuar;
      $("continuar").href = c.url || `/unidad.html?u=${c.unidad.id}`;
      $("continuar-icono").innerHTML = ICONOS[c.tipo];
      $("continuar-tipo").textContent = `${TIPOS[c.tipo]} · Unidad ${c.numUnidad}`;
      $("continuar-titulo").textContent = c.titulo;
      $("continuar-flecha").innerHTML = ICONOS.flecha;

      // Reto de la semana
      const reto = r.contenido.reto;
      const resuelto = r.hechos.has(reto.id);
      $("reto").href = reto.url || "#";
      $("reto-xp").textContent = `Hasta +${reto.xp} XP`;
      $("reto-titulo").textContent = reto.titulo;
      $("reto-detalle").textContent =
        `${reto.preguntas} preguntas · ${resuelto ? "resuelto ✓" : reto.url ? "sin resolver" : "pronto"}`;

      // Lista de unidades
      $("unidades-conteo").textContent = `${r.unidadesCompletas} de ${r.unidades.length} completas`;
      $("unidades").innerHTML = r.unidades.map((u, i) => `
        <li>
          <a class="unidad" href="/unidad.html?u=${u.id}">
            <span class="num">${String(i + 1).padStart(2, "0")}</span>
            <div>
              <h3>${u.titulo}</h3>
              <p>${u.descripcion}</p>
            </div>
            <span></span>
            <span class="conteo">
              <span class="avance delgada"><div style="width:${(u.hechos / u.materiales.length) * 100}%"></div></span>
              ${u.hechos}/${u.materiales.length}
            </span>
          </a>
        </li>`).join("");
    });
  </script>
</body>
</html>
