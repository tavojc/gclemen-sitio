<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3f1">
  <title>Ingresar — gclemen.org</title>
  <meta name="description" content="Matemáticas con el profe Gustavo Clemen. Ingresa con tu código y PIN.">
  <link rel="stylesheet" href="estilos.css?v=3">
</head>
<body>
  <!-- Todas las demás páginas mandan aquí si no hay sesión abierta. -->
  <main class="pantalla ingreso">

    <div class="barra-superior">
      <span class="marca">gclemen.org</span>
      <span class="chip">Estudiantes</span>
    </div>

    <div class="saludo">Matemáticas con el profe Gustavo</div>
    <h1 class="titulo">Ingresar</h1>
    <p class="sub">Escribe el código y el PIN que te dio el profe.</p>

    <form id="formulario">
      <div class="campo">
        <label for="codigo">Código</label>
        <!-- autocapitalize: el celular pone mayúsculas solo -->
        <input id="codigo" type="text" placeholder="G7-014"
               autocomplete="username" autocapitalize="characters" required>
      </div>

      <div class="campo">
        <label for="pin">PIN</label>
        <!-- inputmode="numeric": el celular muestra el teclado de números -->
        <input id="pin" type="password" placeholder="••••••"
               inputmode="numeric" autocomplete="current-password" required>
      </div>

      <button id="boton" class="boton" type="submit">Entrar</button>
      <div id="mensaje" class="mensaje" role="alert"></div>
    </form>

    <p class="ayuda">¿Olvidaste tu PIN? Pídele al profe uno nuevo.</p>
  </main>

  <script type="module">
    import { ingresar, alCambiarSesion } from "./js/sesion.js?v=3";

    // A dónde ir después de entrar: la página que pidió el ingreso, o el inicio.
    // Solo aceptamos rutas de este mismo sitio (que empiecen con "/").
    let volver = new URLSearchParams(location.search).get("volver") || "/";
    if (!volver.startsWith("/") || volver.startsWith("//")) volver = "/";

    // Si ya tiene la sesión abierta en este celular, no le pedimos nada.
    alCambiarSesion((usuario) => { if (usuario) location.replace(volver); });

    const formulario = document.getElementById("formulario");
    const boton = document.getElementById("boton");
    const mensaje = document.getElementById("mensaje");

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();          // evita que la página se recargue
      boton.disabled = true;
      boton.textContent = "Entrando…";
      mensaje.textContent = "";

      const codigo = document.getElementById("codigo").value;
      const pin = document.getElementById("pin").value;
      const resultado = await ingresar(codigo, pin);

      if (!resultado.ok) {
        mensaje.textContent = resultado.mensaje;
        boton.disabled = false;
        boton.textContent = "Entrar";
      }
      // Si salió bien, alCambiarSesion detecta el ingreso y redirige.
    });
  </script>
</body>
</html>
