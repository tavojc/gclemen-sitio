<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7ec">
  <title>Ingresar — gclemen.org</title>
  <!-- Todos los estilos están ahora en estilos.css (sección 11). -->
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header class="encabezado">
    <a href="/" class="logo">gclemen<span>.org</span></a>
  </header>

  <main class="pagina-centrada">
    <span class="etiqueta">Estudiantes</span>
    <h1>Ingresar</h1>
    <p class="sub">Escribe el código y el PIN que te dio el profe.</p>

    <form id="formulario" class="bloque">
      <div class="campo">
        <label for="codigo">Código</label>
        <!-- autocapitalize: el celular pone mayúsculas solo -->
        <input id="codigo" type="text" placeholder="G7-014"
               autocomplete="username" autocapitalize="characters" required>
      </div>

      <div class="campo">
        <label for="pin">PIN</label>
        <!-- inputmode="numeric": el celular muestra el teclado de números -->
        <input id="pin" type="password" placeholder="••••••"               inputmode="numeric" autocomplete="current-password" required>
      </div>

      <button id="boton" class="boton ancho" type="submit">Entrar</button>
      <div id="mensaje" class="mensaje" role="alert"></div>
    </form>

    <p class="ayuda">¿Olvidaste tu PIN? Pídele al profe uno nuevo.<br>
      <a href="/">Volver al inicio sin ingresar</a></p>
  </main>

  <script type="module">
    import { ingresar, alCambiarSesion } from "./js/sesion.js";

    // A dónde ir después de entrar (por defecto, "Mi cuenta").
    const volver = new URLSearchParams(location.search).get("volver") || "/mi-cuenta.html";

    // Si ya tiene la sesión abierta en este celular, no le pedimos nada.
    alCambiarSesion((usuario) => { if (usuario) location.href = volver; });

    const formulario = document.getElementById("formulario");
    const boton = document.getElementById("boton");
    const mensaje = document.getElementById("mensaje");

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();          // evita que la página se recargue
      boton.disabled = true;
      boton.textContent = "Entrando…";
      mensaje.textContent = "";

      const codigo = document.getElementById("codigo").value;
      const pin = document.getElementById("pin").value;
      const resultado = await ingresar(codigo, pin);

      if (!resultado.ok) {
        mensaje.textContent = resultado.mensaje;
        boton.disabled = false;
        boton.textContent = "Entrar";
      }
      // Si salió bien, alCambiarSesion detecta el ingreso y redirige.
    });
  </script>
</body>
</html>
