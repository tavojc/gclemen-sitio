<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — gclemen.org</title>
  <link rel="stylesheet" href="estilos.css">
  <style>
    /* Estilos solo de esta página (para no chocar con estilos.css) */
    .caja-ingreso {
      max-width: 360px; margin: 3rem auto; padding: 2rem;
      background: #fff; border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      font-family: system-ui, sans-serif;
    }
    .caja-ingreso h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
    .caja-ingreso p.sub { margin: 0 0 1.5rem; color: #666; }
    .caja-ingreso label { display: block; font-weight: 600; margin: 1rem 0 .35rem; }
    .caja-ingreso input {
      width: 100%; box-sizing: border-box; padding: .8rem; font-size: 1.2rem;
      border: 2px solid #ddd; border-radius: 10px;
    }
    .caja-ingreso input:focus { outline: none; border-color: #2b6cb0; }
    #pin { letter-spacing: .4em; }
    .caja-ingreso button {
      width: 100%; margin-top: 1.5rem; padding: .9rem; font-size: 1.1rem;
      border: 0; border-radius: 10px; background: #2b6cb0; color: #fff; cursor: pointer;
    }
    .caja-ingreso button:disabled { opacity: .6; cursor: wait; }
    #mensaje { min-height: 1.5em; margin-top: 1rem; color: #c53030; text-align: center; }
    .ayuda { margin-top: 1.5rem; font-size: .9rem; color: #777; text-align: center; }
  </style>
</head>
<body>

  <main class="caja-ingreso">
    <h1>Ingresar</h1>
    <p class="sub">Escribe el código y el PIN que te dio el profe.</p>

    <form id="formulario">
      <label for="codigo">Código</label>
      <!-- autocapitalize: el celular pone mayúsculas solo -->
      <input id="codigo" type="text" placeholder="G7-014"
             autocomplete="username" autocapitalize="characters" required>

      <label for="pin">PIN</label>
      <!-- inputmode="numeric": el celular muestra el teclado de números -->
      <input id="pin" type="password" placeholder="••••••"
             inputmode="numeric" autocomplete="current-password" required>

      <button id="boton" type="submit">Entrar</button>
      <div id="mensaje" role="alert"></div>
    </form>

    <p class="ayuda">¿Olvidaste tu PIN? Pídele al profe uno nuevo.<br>
      <a href="/">Volver al inicio sin ingresar</a></p>
  </main>

  <script type="module">
    import { ingresar, alCambiarSesion } from "./js/sesion.js";

    // A dónde ir después de entrar (por defecto, "Mi cuenta").
    const volver = new URLSearchParams(location.search).get("volver") || "/mi-cuenta.html";

    // Si ya tiene la sesión abierta en este celular, no le pedimos nada.
    alCambiarSesion((usuario) => { if (usuario) location.href = volver; });

    const formulario = document.getElementById("formulario");
    const boton = document.getElementById("boton");
    const mensaje = document.getElementById("mensaje");

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();          // evita que la página se recargue
      boton.disabled = true;
      boton.textContent = "Entrando…";
      mensaje.textContent = "";

      const codigo = document.getElementById("codigo").value;
      const pin = document.getElementById("pin").value;
      const resultado = await ingresar(codigo, pin);

      if (!resultado.ok) {
        mensaje.textContent = resultado.mensaje;
        boton.disabled = false;
        boton.textContent = "Entrar";
      }
      // Si salió bien, alCambiarSesion detecta el ingreso y redirige.
    });
  </script>
</body>
</html>
