<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3f1">
  <title>Perfil — gclemen.org</title>
  <link rel="stylesheet" href="estilos.css?v=3">
</head>
<body class="cargando">
  <main class="pantalla">

    <div class="barra-superior">
      <span class="marca">gclemen.org</span>
    </div>

    <div class="saludo">Perfil</div>
    <h1 class="titulo" id="nombre" data-datos>Cargando…</h1>

    <div data-datos>
      <div class="dato"><span>Código</span><strong id="codigo">—</strong></div>
      <div class="dato"><span>Grado</span><strong id="grado">—</strong></div>
      <div class="dato"><span>Nivel</span><strong id="nivel">—</strong></div>
    </div>

    <!-- Importante en celulares compartidos -->
    <p style="margin-top:30px">
      <button id="salir" class="boton secundario" type="button">No soy yo / Cerrar sesión</button>
    </p>
    <p class="ayuda">Si alguien más va a usar este celular, cierra tu sesión para que no vea ni cambie tu progreso.</p>

  </main>

  <script type="module">
    import { iniciarPantalla } from "./js/app.js?v=3";
    import { salir } from "./js/sesion.js?v=3";

    const $ = (id) => document.getElementById(id);

    iniciarPantalla("perfil", (usuario, r) => {
      $("nombre").textContent = usuario.nombre || (usuario.esDocente ? "Profe" : "Estudiante");
      $("codigo").textContent = usuario.esDocente ? "Docente" : usuario.codigo || "—";
      $("grado").textContent = usuario.curso || `${r.grado}°`;
      $("nivel").textContent = `${r.nivel} · ${r.nombre}`;
    });

    $("salir").addEventListener("click", async () => {
      await salir();
      location.href = "/ingresar.html";
    });
  </script>
</body>
</html>
